name: CI

# Duas coisas a cada push na main:
#
#   1. as provas rodam contra um Postgres LIMPO, criado do zero pelas migrations
#      — é o que garante que a máquina de quem clonar amanhã não nasce quebrada
#      (era o X12 do PRD);
#   2. a imagem do app é construída e publicada no registro do GitHub.
#
# A imagem publicada faz o deploy virar um passo: qualquer provedor que aceite
# imagem OCI aponta para ela e sobe, sem construir nada e sem adivinhar stack.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  BANCO: postgres://caixa:caixa@localhost:5432/caixa_vivo

jobs:
  provas:
    name: Provas do Caixa Vivo
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: caixa
          POSTGRES_PASSWORD: caixa
          POSTGRES_DB: caixa_vivo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U caixa -d caixa_vivo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    defaults:
      run:
        working-directory: caixa-vivo

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caixa-vivo/package-lock.json

      # `npm ci` e não `npm install`: ele falha se o lockfile estiver fora de
      # sincronia com o package.json, em vez de consertar em silêncio.
      - run: npm ci

      - name: Migrar o banco do zero
        run: npm run banco:migrar
        env:
          DATABASE_URL: ${{ env.BANCO }}
          PGSSL: '0'

      - name: Testes
        run: npm test
        env:
          DATABASE_URL: ${{ env.BANCO }}
          PGSSL: '0'

      - name: Build e conferência de dado simulado
        run: npm run verificar

  tela-do-design-os:
    name: Build do Design OS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imersao-teste-design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: imersao-teste-design/package-lock.json
      - run: npm ci
      - run: npm run build

  imagem:
    name: Publicar a imagem
    needs: provas
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # O GITHUB_TOKEN da própria execução já tem permissão de escrita no
      # registro — não precisa de segredo cadastrado à mão.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: nome
        run: echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}/caixa-vivo" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: caixa-vivo
          push: true
          tags: |
            ${{ steps.nome.outputs.imagem }}:latest
            ${{ steps.nome.outputs.imagem }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Onde a imagem ficou
        run: |
          echo "### Imagem publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.nome.outputs.imagem }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Aponte o serviço da Railway para ela e defina DATABASE_URL." >> "$GITHUB_STEP_SUMMARY"
